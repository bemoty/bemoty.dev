{{ define "main" }}
<main class="page" id="main-content">
  {{ .Content }}
  <ul>
    {{ range .Paginator.Pages }}
    <li>
      <div>
        {{ .Date.Format "2006-01-02" }}
        <a href="{{ .RelPermalink }}">{{.Title }}</a>
      </div>
      {{ with .Description }}<p class="muted">{{ . }}</p>{{ end }}
    </li>
    {{ end }}
  </ul>
</main>
{{ end }}
