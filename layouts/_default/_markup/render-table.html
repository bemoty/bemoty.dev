<div class="table-wrapper" role="region" tabindex="0" aria-label="Table {{ add .Ordinal 1 }}">
<table
  {{- range $k, $v := .Attributes }}
    {{- if $v }}{{ printf " %s=%q" $k (string $v) | safeHTMLAttr }}{{ end }}
  {{- end }}>
  <thead>
    {{- range .THead }}
    <tr>
      {{- range . }}
      <th{{ with .Alignment }} class="align-{{ . }}"{{ end }}>{{ .Text }}</th>
      {{- end }}
    </tr>
    {{- end }}
  </thead>
  <tbody>
    {{- range .TBody }}
    <tr>
      {{- range . }}
      <td{{ with .Alignment }} class="align-{{ . }}"{{ end }}>{{ .Text }}</td>
      {{- end }}
    </tr>
    {{- end }}
  </tbody>
</table>
</div>
